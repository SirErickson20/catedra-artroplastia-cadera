<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícono: prótesis total de cadera (cotilo, cabeza femoral y vástago dentro del fémur) -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.45" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="esfera" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </radialGradient>
    <linearGradient id="copa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hueso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde9c9"/>
      <stop offset="1" stop-color="#f3cf99"/>
    </linearGradient>
  </defs>

  <g stroke="#1e1b4b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Fémur proximal (con trocánter mayor) -->
    <path d="M29 33 C31 29 35 27.5 39 28 C43 26 49 26.5 52 30.5 C54 33.5 52.5 37.5 50 39.5 L49.5 60 L36.5 60 L37 45 C36.5 41 33 38 29 33 Z" fill="url(#hueso)"/>
    <!-- Vástago femoral dentro del hueso -->
    <path d="M28.5 27 L34.5 22.5 L42 31.5 C44.5 34.5 45 37.5 44.6 41 L43.2 56 C43 58 40 58 39.8 56 L39 42 C38.7 39 37 36.5 34.5 34 Z" fill="url(#metal)"/>
    <!-- Copa acetabular (cotilo) -->
    <path d="M5 23 A17 17 0 0 1 39 23 L34.5 23 A12.5 12.5 0 0 0 9.5 23 Z" fill="url(#copa)"/>
    <!-- Cabeza femoral -->
    <circle cx="22" cy="23" r="10.5" fill="url(#esfera)"/>
  </g>
</svg>
